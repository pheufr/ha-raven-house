trigger_job:
  description: Trigger a Raven House Job immediately
  fields:
    entity_id:
      description: The primary job binary sensor entity ID to trigger
      example: "binary_sensor.rh_jobs_trash_day"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: binary_sensor
    job_id:
      description: Job ID as an alternative to entity_id
      example: "trashday"

complete_job:
  description: Mark a Raven House Job as completed
  fields:
    entity_id:
      description: The primary job binary sensor entity ID to complete
      example: "binary_sensor.rh_jobs_trash_day"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: binary_sensor
    job_id:
      description: Job ID as an alternative to entity_id
      example: "trashday"

dismiss_job:
  description: Dismiss a Raven House Job without marking it completed
  fields:
    entity_id:
      description: The primary job binary sensor entity ID to dismiss
      example: "binary_sensor.rh_jobs_trash_day"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: binary_sensor
    job_id:
      description: Job ID as an alternative to entity_id
      example: "trashday"

rename_job:
  description: Rename a Raven House Job
  fields:
    entity_id:
      description: The primary job binary sensor entity ID
      example: "binary_sensor.rh_jobs_trash_day"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: binary_sensor
    job_id:
      description: Job ID as an alternative to entity_id
      example: "trashday"
    name:
      description: New display name for the job
      example: "Kitchen Bins"

update_job_image:
  description: Update a Raven House Job image using media picker/upload
  fields:
    entity_id:
      description: The primary job binary sensor entity ID
      example: "binary_sensor.rh_jobs_trash_day"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: binary_sensor
    job_id:
      description: Job ID as an alternative to entity_id
      example: "trashday"
    image:
      description: Job image selected from media
      selector:
        media:
          accept:
            - image/*

add_job:
  description: Add a Raven House Job
  fields:
    name:
      description: Job display name
      example: "Kitchen Bins"
    trigger_type:
      description: Trigger type (schedule, frequency, or manual)
      example: "schedule"
    cron_expression:
      description: Cron expression for scheduled jobs
      example: "0 0 * * *"
    days_interval:
      description: Interval in days for frequency jobs
      example: 7
    image:
      description: Optional image selected from media
      example: "/local/jobs/bins.png"
      selector:
        media:
          accept:
            - image/*
    icon:
      description: Optional MDI icon name (e.g. mdi:trash-can)
      example: "mdi:trash-can"
      selector:
        icon:
    colour:
      description: Optional colour for the icon background (CSS colour value)
      example: "#4CAF50"
      selector:
        color_rgb:
    priority:
      description: Priority value
      example: 0

update_job_icon:
  description: Update the icon for a Raven House Job
  fields:
    entity_id:
      description: The primary job binary sensor entity ID
      example: "binary_sensor.rh_jobs_trash_day"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: binary_sensor
    job_id:
      description: Job ID as an alternative to entity_id
      example: "trashday"
    icon:
      description: MDI icon name (e.g. mdi:trash-can)
      example: "mdi:trash-can"
      selector:
        icon:

update_job_colour:
  description: Update the icon background colour for a Raven House Job
  fields:
    entity_id:
      description: The primary job binary sensor entity ID
      example: "binary_sensor.rh_jobs_trash_day"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: binary_sensor
    job_id:
      description: Job ID as an alternative to entity_id
      example: "trashday"
    colour:
      description: CSS colour value for the icon background
      example: "#4CAF50"
      selector:
        color_rgb:

add_player:
  description: Add a player to Raven House Quiz
  fields:
    name:
      description: Player full name
      example: "Alice Smith"
    alias:
      description: Player alias shown on the leaderboard
      example: "Ace"
    photo:
      description: Player photo selected from media
      example: "/local/players/alice.jpg"
      selector:
        media:
          accept:
            - image/*

remove_player:
  description: Remove a player from Raven House Quiz permanently
  fields:
    entity_id:
      description: Any player entity ID
      example: "sensor.rh_quiz_player1"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: sensor
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"

enable_player:
  description: Enable a player for the current quiz
  fields:
    entity_id:
      description: Any player entity ID
      example: "sensor.rh_quiz_player1"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: sensor
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"

disable_player:
  description: Disable a player for the current quiz
  fields:
    entity_id:
      description: Any player entity ID
      example: "sensor.rh_quiz_player1"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: sensor
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"

rename_player:
  description: Rename a quiz player
  fields:
    entity_id:
      description: Any player entity ID
      example: "sensor.rh_quiz_player1"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: sensor
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"
    name:
      description: New player name
      example: "Alice Smith"

update_player_alias:
  description: Update a quiz player alias
  fields:
    entity_id:
      description: Any player entity ID
      example: "sensor.rh_quiz_player1"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: sensor
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"
    alias:
      description: New alias
      example: "Ace"

update_player_photo:
  description: Update a quiz player image path
  fields:
    entity_id:
      description: Any player entity ID
      example: "sensor.rh_quiz_player1"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: sensor
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"
    photo:
      description: New photo selected from media
      example: "/local/players/alice.jpg"
      selector:
        media:
          accept:
            - image/*

reset_player_score:
  description: Reset one player's scores to zero
  fields:
    entity_id:
      description: Any player entity ID
      example: "sensor.rh_quiz_player1"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: sensor
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"

add_points:
  description: Add points to a player's current round score
  fields:
    entity_id:
      description: Any player entity ID
      example: "sensor.rh_quiz_player1"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: sensor
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"
    points:
      description: Number of points to add
      example: 5

remove_points:
  description: Remove points from a player's current round score
  fields:
    entity_id:
      description: Any player entity ID
      example: "sensor.rh_quiz_player1"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: sensor
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"
    points:
      description: Number of points to remove
      example: 5

use_joker:
  description: Double a player's current round score
  fields:
    entity_id:
      description: Any player entity ID
      example: "sensor.rh_quiz_player1"
      selector:
        entity:
          filter:
            - integration: raven_house_tools
              domain: sensor
    player_id:
      description: Player ID as an alternative to entity_id
      example: "player1"

set_quiz_rounds:
  description: Replace the quiz round list and optionally set the active round
  fields:
    rounds:
      description: Ordered list of round names
      example:
        - "General Knowledge"
        - "Music"
    active_round_index:
      description: Zero-based active round index, or omit to clear the active round
      example: 0
    round_position_index:
      description: Zero-based round position to remember while no round is active
      example: 0

start_new_round:
  description: End the active round and immediately start the next round

end_round:
  description: End the active round and enter a break between rounds

start_round:
  description: Start the next round from the remembered round position

start_new_quiz:
  description: Reset all quiz scores to zero

reset_quiz:
  description: Reset all scores and disable all players

soundboard_connect:
  description: Connect a soundboard playback session to a media player
  fields:
    entity_id:
      description: Target media player entity ID
      example: "media_player.living_room_speaker"
      selector:
        entity:
          filter:
            - domain: media_player
    dead_air_media:
      description: Optional dead-air media source used to keep a warm session
      example: "media-source://media_source/local/soundboard/dead_air.mp3"
      selector:
        media:
          accept:
            - audio/*

soundboard_disconnect:
  description: Disconnect the soundboard playback session
  fields:
    entity_id:
      description: Optional media player entity ID override
      example: "media_player.living_room_speaker"
      selector:
        entity:
          filter:
            - domain: media_player

soundboard_play_clip:
  description: Play one soundboard clip on the selected media player
  fields:
    entity_id:
      description: Target media player entity ID
      example: "media_player.living_room_speaker"
      selector:
        entity:
          filter:
            - domain: media_player
    media:
      description: Clip media path or media-source identifier
      example: "media-source://media_source/local/sfx/airhorn.mp3"
      selector:
        media:
          accept:
            - audio/*
    connected:
      description: Use connected-session queue mode
      example: true
      default: false
      selector:
        boolean:
    dead_air_media:
      description: Optional dead-air media used between clips in connected mode
      example: "media-source://media_source/local/soundboard/dead_air.mp3"
      selector:
        media:
          accept:
            - audio/*

soundboard_set_target:
  description: Set the default media player target for the soundboard session
  fields:
    entity_id:
      description: Target media player entity ID
      example: "media_player.living_room_speaker"
      selector:
        entity:
          filter:
            - domain: media_player

soundboard_set_mode:
  description: Set playback mode for a target media player
  fields:
    entity_id:
      description: Target media player entity ID
      example: "media_player.living_room_speaker"
      selector:
        entity:
          filter:
            - domain: media_player
    mode:
      description: Playback mode (connected uses warm-session queueing; direct uses replace play)
      example: "connected"
      default: "connected"
      selector:
        select:
          options:
            - connected
            - direct
